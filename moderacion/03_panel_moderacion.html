<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flora Rosario · Moderación</title>
<style>
  :root{--marron:#3d2b1e;--verde:#2c5e42;--tinte:#b35434;--crema:#faf5ec;--papel:#fffdf8;--linea:#e6ddcc;--gris:#7a6f61;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--crema);color:#2a2118}
  header{background:var(--marron);color:#f4ecdd;padding:14px 18px;display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;flex:1}
  main{max-width:680px;margin:0 auto;padding:14px}
  .login{max-width:360px;margin:60px auto;text-align:center;background:var(--papel);border:1px solid var(--linea);border-radius:16px;padding:28px}
  .login input{padding:12px;border:1.5px solid var(--linea);border-radius:10px;font-size:15px;width:100%;text-align:center}
  .login button{margin-top:10px;padding:12px 22px;border-radius:10px;border:none;background:var(--tinte);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tabs button{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--linea);background:var(--papel);font-weight:800;font-size:13px;cursor:pointer;color:var(--gris)}
  .tabs button.on{background:var(--marron);color:#f4ecdd;border-color:var(--marron)}
  .estado-bar{background:#efe9db;font-size:11.5px;color:#6b6152;border-radius:9px;padding:7px 10px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .estado-bar span{flex:1}
  .estado-bar button{border:none;background:transparent;color:#6b6152;font-size:14px;cursor:pointer;padding:2px 6px}
  .pend{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:12px;margin-bottom:12px;transition:opacity .25s}
  .pend img.f{width:100%;max-height:230px;object-fit:cover;border-radius:10px;margin-bottom:8px}
  .pend h3{margin:0;font-size:15px}
  .sub{font-size:12px;color:var(--gris);margin:3px 0}
  .badge{display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 9px;margin:3px 4px 3px 0}
  .b-t{background:#f7e8df;color:#8a4326}
  .b-nt{background:#eee9dd;color:#6c6558}
  .b-acc{background:#e4f0e0;color:#2c5e42}
  .acciones{display:flex;gap:8px;margin-top:9px}
  .btn{flex:1;padding:11px;border-radius:10px;border:none;font-weight:800;font-size:13.5px;cursor:pointer}
  .ok{background:var(--verde);color:#fff}
  .no{background:#fff;border:1.5px solid #d8c9c2;color:#a33}
  .btn-neutro{background:#eee9dd;color:#6b6152;border:none}
  .motivo{margin-top:9px}
  .motivo input{width:100%;padding:10px;border:1.5px solid var(--linea);border-radius:9px;font-size:13px}
  .motivo .fila{display:flex;gap:8px;margin-top:7px}
  .sech{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--gris);font-weight:800;margin:16px 0 8px}
  .pub{background:var(--papel);border:1px solid var(--linea);border-radius:12px;padding:10px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
  .pub img{width:52px;height:52px;object-fit:cover;border-radius:9px;flex:none}
  .pub .tx{flex:1;min-width:0}
  .pub b{font-size:13.5px}
  .pub .s{font-size:11.5px;color:var(--gris)}
  .pub button{flex:none;padding:8px 12px;border-radius:9px;border:1.5px solid #d8c9c2;background:#fff;color:#a33;font-weight:700;font-size:12px;cursor:pointer}
  .vacio{text-align:center;color:var(--gris);padding:40px 20px;line-height:1.6}
  .procesando{font-size:12px;color:var(--gris);padding:11px 0}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--marron);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;display:none;max-width:90%}
</style>
</head>
<body>
<header>
  <div style="font-size:22px">🛡️</div>
  <h1>Flora Rosario · Moderación</h1>
</header>
<main>
  <div id="login" class="login">
    <div style="font-size:38px">🔒</div>
    <p style="font-size:13px;color:var(--gris);line-height:1.5">Panel de aprobación de relevamientos.<br>Ingresá el PIN de moderación.</p>
    <input type="password" id="pin" placeholder="PIN de moderador" />
    <button onclick="entrar()">Entrar</button>
    <p id="err" style="color:#a33;font-size:12px;min-height:16px"></p>
  </div>
  <div id="contenido" style="display:none">
    <div class="tabs">
      <button id="tabP" class="on" onclick="verTab('p')">⏳ Pendientes</button>
      <button id="tabL" onclick="verTab('l')">🌍 Publicados</button>
    </div>
    <div class="estado-bar" id="barra"><span>Cargando…</span><button title="Actualizar" onclick="recargar()">⟳</button></div>
    <div id="lista"></div>
  </div>
</main>
<div id="toast"></div>

<script>
var PIN = sessionStorage.getItem('fr_pin') || '';
var TAB = 'p';
function $(s){return document.querySelector(s);}
function toast(t){var e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(function(){e.style.display='none';},3000);}

function entrar(){
  PIN = $('#pin').value;
  google.script.run.withSuccessHandler(function(ok){
    if(ok){ sessionStorage.setItem('fr_pin', PIN); $('#login').style.display='none'; $('#contenido').style.display='block'; recargar(); }
    else { $('#err').textContent='PIN incorrecto'; }
  }).withFailureHandler(function(e){ $('#err').textContent='Error: '+e; }).validarPin(PIN);
}
$('#pin').addEventListener('keydown', function(e){ if(e.key==='Enter') entrar(); });

function verTab(t){
  TAB = t;
  $('#tabP').classList.toggle('on', t==='p');
  $('#tabL').classList.toggle('on', t==='l');
  recargar();
}
function recargar(){ TAB==='p' ? cargar() : cargarPublicados(); }
function errorBarra(e){ $('#barra').innerHTML = '<span>Error: '+esc(String(e))+'</span>'; }

/* ── Pestaña Pendientes ── */
function cargar(){
  $('#barra').innerHTML = '<span>Cargando pendientes…</span>';
  google.script.run.withSuccessHandler(render).withFailureHandler(errorBarra).pendientes();
}
function render(pends){
  $('#barra').innerHTML = '<span>'+pends.length+' envío(s) pendiente(s) · '+new Date().toLocaleString('es-AR')+'</span>';
  if(!pends.length){ $('#lista').innerHTML = '<div class="vacio">✅ No hay nada pendiente.<br>Los relevamientos nuevos (app o formulario) aparecen acá.</div>'; return; }
  $('#lista').innerHTML = pends.map(function(r){
    var tin = (r.isDyePlant === true || r.isDyePlant === 'sí') ? '<span class="badge b-t">🧶 tintórea</span>'
            : (r.isDyePlant === false || r.isDyePlant === 'no') ? '<span class="badge b-nt">no tintórea</span>'
            : '<span class="badge b-nt">tintórea: sin definir ⚠️</span>';
    return '<div class="pend" id="p_'+r.id+'">'
      + (r.foto ? '<img class="f" src="'+r.foto+'" alt="foto del ejemplar">' : '')
      + '<h3>'+esc(r._speciesName)+'</h3>'
      + '<div class="sub">'+esc(r.parkName)+(r.addressOrZone? ' · '+esc(r.addressOrZone):'')+'</div>'
      + '<div class="sub">📍 <a href="https://www.openstreetmap.org/?mlat='+r.lat+'&mlon='+r.lng+'#map=18/'+r.lat+'/'+r.lng+'" target="_blank">'+r.lat+', '+r.lng+'</a>'
      + ' · por '+esc(r.relevador||'—')+' · '+new Date(r._fecha).toLocaleString('es-AR')+'</div>'
      + tin + (r.specimenCount? '<span class="badge b-acc">✖ '+r.specimenCount+'</span>':'')
      + (r.curiosityFact? '<div class="sub" style="margin-top:6px">💬 '+esc(r.curiosityFact)+'</div>':'')
      + '<div class="acciones" id="a_'+r.id+'">'
      + '<button class="btn ok" onclick="aprobar(\''+r.id+'\')">✅ Aprobar</button>'
      + '<button class="btn no" onclick="mostrarMotivo(\''+r.id+'\')">🗑️ Rechazar</button>'
      + '</div><div class="motivo" id="m_'+r.id+'" style="display:none">'
      + '<input placeholder="Motivo del rechazo (opcional)" />'
      + '<div class="fila"><button class="btn no" onclick="confirmarRechazo(\''+r.id+'\')">🗑️ Confirmar rechazo</button>'
      + '<button class="btn btn-neutro" onclick="cancelarMotivo(\''+r.id+'\')">Cancelar</button></div></div>'
      + '</div>';
  }).join('');
}
function mostrarMotivo(id){
  cancelarMotivo();   // solo uno abierto a la vez
  var el = document.getElementById('m_'+id);
  if(el){ el.style.display='block'; el.querySelector('input').focus(); }
}
function cancelarMotivo(id){
  document.querySelectorAll('.motivo').forEach(function(m){ m.style.display='none'; });
}
function marcarProcesando(id){
  var a = document.getElementById('a_'+id);
  if(a) a.innerHTML = '<span class="procesando">⏳ Procesando…</span>';
}
function restaurar(id){
  cargar();  // re-render limpia el estado
}
function aprobar(id){
  marcarProcesando(id);
  google.script.run.withSuccessHandler(function(){
    var el = document.getElementById('p_'+id); if(el) el.remove();
    toast('✅ Aprobado: ya visible en el mapa');
    setTimeout(cargar, 500);
  }).withFailureHandler(function(e){ toast('⚠️ Error: '+e); restaurar(id); })
    .moderarDesdePanel(id, 'aprobado', PIN, '');
}
function confirmarRechazo(id){
  var caja = document.getElementById('m_'+id);
  var motivo = caja ? caja.querySelector('input').value.trim() : '';
  marcarProcesando(id);
  var m = document.getElementById('m_'+id); if(m) m.remove();
  google.script.run.withSuccessHandler(function(){
    var el = document.getElementById('p_'+id); if(el) el.remove();
    toast('🗑️ Rechazado: no se publica' + (motivo? ' (motivo registrado)':''));
    setTimeout(cargar, 500);
  }).withFailureHandler(function(e){ toast('⚠️ Error: '+e); restaurar(id); })
    .moderarDesdePanel(id, 'rechazado', PIN, motivo);
}

/* ── Pestaña Publicados ── */
function cargarPublicados(){
  $('#barra').innerHTML = '<span>Cargando publicados…</span>';
  google.script.run.withSuccessHandler(renderPublicados).withFailureHandler(errorBarra).listarPublicados(PIN);
}
function renderPublicados(r){
  if(!r || !r.ok){ errorBarra('respuesta inválida'); return; }
  $('#barra').innerHTML = '<span>'+(r.comunitarios.length+r.base.length)+' publicados · '+r.bajas+' de baja · '+new Date().toLocaleString('es-AR')+'</span>';
  var h = '';
  h += '<div class="sech">Comunitarios aprobados ('+r.comunitarios.length+')</div>';
  h += r.comunitarios.length ? r.comunitarios.map(filaPublic).join('')
     : '<div class="sub">Todavía no hay ejemplares comunitarios aprobados.</div>';
  h += '<div class="sech">Base central ('+r.base.length+')</div>';
  h += r.base.length ? r.base.map(filaPublic).join('')
     : '<div class="sub">Si no aparece la base: importar <b>base-para-importar.csv</b> a la hoja "Base" (ver guía, 2 minutos).</div>';
  if(r.bajas) h += '<div class="sub" style="margin-top:12px">🗑️ '+r.bajas+' ejemplar(es) dado(s) de baja. Reactivar: hoja "Base" → estado = aprobado.</div>';
  $('#lista').innerHTML = h;
}
function filaPublic(r){
  return '<div class="pub" id="q_'+r.id+'">'
    + (r.fotoUrl ? '<img src="'+esc(r.fotoUrl)+'" alt="">' : '')
    + '<div class="tx"><b>'+esc(r._speciesName)+'</b>'
    + '<div class="s">'+esc(r.parkName)+' · <a href="https://www.openstreetmap.org/?mlat='+r.lat+'&mlon='+r.lng+'#map=18/'+r.lat+'/'+r.lng+'" target="_blank">'+(+r.lat).toFixed(4)+', '+(+r.lng).toFixed(4)+'</a></div>'
    + (r._relevador? '<div class="s">por '+esc(r._relevador)+'</div>':'')
    + '</div>'
    + '<button onclick="darBaja(\''+r.id+'\')">🗑️ Dar de baja</button>'
    + '</div>';
}
function darBaja(id){
  var esCom = (String(id).lastIndexOf('app_',0)===0 || String(id).lastIndexOf('com_',0)===0);
  var fin = function(){
    var el = document.getElementById('q_'+id); if(el){ el.style.opacity='.4'; el.querySelector('button').outerHTML='<span class="sub">de baja ✓</span>'; }
    toast('🗑️ Dado de baja: desaparece del mapa');
    setTimeout(cargarPublicados, 800);
  };
  var fallo = function(e){ toast('⚠️ Error: '+e); };
  if(esCom){
    google.script.run.withSuccessHandler(fin).withFailureHandler(fallo).moderarDesdePanel(id,'rechazado',PIN,'dado de baja desde el panel');
  } else {
    google.script.run.withSuccessHandler(fin).withFailureHandler(fallo).cambiarEstadoBase(id,'baja',PIN);
  }
}

function esc(s){ return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c];}); }

if(PIN){ $('#pin').value = PIN; entrar(); }
</script>
</body>
</html>
