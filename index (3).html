<script>
/* Redirección por dispositivo: celular/tablet → versión móvil · resto → escritorio */
(function(){
  var esMovil = window.matchMedia('(max-width: 820px)').matches
    || /Android|iPhone|iPad|iPod|Mobi|Silk/i.test(navigator.userAgent);
  location.replace(esMovil ? 'movil/' : 'escritorio/');
})();
</script>
